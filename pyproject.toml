[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel"
version = "0.1.0"
dependencies = [
    "pandas",
    "yfinance",
    "catboost",
    "plotly",
    "streamlit",
    "shap",
    "selenium",
    "scipy",
    "matplotlib",
    "requests",
    "urllib3",
    "TA-Lib",
    "seaborn",
    "lxml",
    "pyarrow",
    "google-genai",
    "python-dotenv",
    "html5lib"
]

[tool.setuptools]
packages = ["kitsune_quant", "kitsune_portfolio"]
py-modules = ["config"]