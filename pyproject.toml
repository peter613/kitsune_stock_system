[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel"
version = "0.1.0"
dependencies = [
    "pandas",
    "yfinance>=1.4.1",
    "catboost",
    "plotly",
    "streamlit",
    "shap",
    "selenium",
    "scipy",
    "matplotlib",
    "requests",
    "urllib3",
    "TA-Lib",
    "pyarrow",
    "python-dotenv",
    "html5lib",
    "supabase",
    "questionary",
]

[tool.setuptools]
packages = ["fund_stock", "fund_etf", "market_data", "portfolio", "sandbox"]
py-modules = ["config"]