name: Daily Market Scraper

on:
  # 支援外部定時觸發 (由 cron-job.org 觸發)
  workflow_dispatch:
  repository_dispatch:
    types: [Daily_Market_Scraper]

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # 不使用 pip install -e . 以避開 TA-Lib 的複雜 C++ 編譯問題，
      # 只安裝爬蟲與上傳所需要的輕量套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv supabase pyarrow

      - name: Update Market Data & NAV
        env:
          GITHUB_ACTIONS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DC_WEBHOOK_URL: ${{ secrets.DC_WEBHOOK_URL }}
          DC_DATABASE_WEBHOOK_URL: ${{ secrets.DC_DATABASE_WEBHOOK_URL }}
        run: |
          python github_action/update_data.py
