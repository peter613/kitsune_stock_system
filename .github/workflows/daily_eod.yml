name: Daily EOD Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [Daily_Market_Scraper, daily_eod, daily_pipeline]

jobs:
  eod-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # 只安裝爬蟲、結算與風控所需的輕量套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv supabase pyarrow 

      - name: 1. Update Market Data & NAV
        env:
          GITHUB_ACTIONS: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DC_DATABASE_WEBHOOK_URL: ${{ secrets.DC_DATABASE_WEBHOOK_URL }}
        run: |
          python github_action/update_data.py

      - name: 2. Evaluate Risk Control
        env:
          GITHUB_ACTIONS: "true"
          DC_RISK_WEBHOOK_URL: ${{ secrets.DC_RISK_WEBHOOK_URL }}
        run: |
          python github_action/risk_control.py
